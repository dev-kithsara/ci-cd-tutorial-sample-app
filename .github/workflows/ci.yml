name: Continuous Integration & Continuous Delivery

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Build and Test (CI)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests

  deploy:
    name: Continuous Delivery to AWS EC2 Staging (CD)
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Clone repo if not present, otherwise pull latest changes
            if [ ! -d "ci-cd-tutorial-sample-app" ]; then
              git clone https://github.com/dev-kithsara/ci-cd-tutorial-sample-app.git
            fi
            cd ci-cd-tutorial-sample-app
            git pull origin master

            # Build and deploy Docker container
            docker build -t sample-app .
            docker stop sample-app || true
            docker rm sample-app || true
            docker run -d --name sample-app -p 8000:8000 --restart always sample-app
